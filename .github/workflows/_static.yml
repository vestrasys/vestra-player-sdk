# Static checks on Ubuntu: the gate before anything is built or tested.
# Called by ci.yml, main.yml and release.yml.
name: Static checks

on:
  workflow_call:
    inputs:
      cache:
        description: Use the npm cache (off for releases).
        type: boolean
        default: true

permissions: {}

jobs:
  code:
    name: tsc · prettier · oxlint · typos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: ${{ inputs.cache && 'npm' || '' }}
      - run: npm ci --ignore-scripts
      - name: Type check (src + test)
        run: npm run check
      - name: Prettier
        run: npm run format:check
      - name: oxlint
        run: npm run lint
      # llms.txt and llms-full.txt are generated from src/, docs/ and
      # examples/ (scripts/llms.mjs); the committed files must be current.
      - name: llms.txt up to date
        run: npm run docs:llms -- --check
      - name: typos
        uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1

  workflows:
    name: actionlint · zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -sSfL -o "$RUNNER_TEMP/actionlint.tgz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: zizmor
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          version: 1.31.1
          advanced-security: false
          annotations: true
