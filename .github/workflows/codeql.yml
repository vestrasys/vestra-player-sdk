# CodeQL code scanning (the security-extended queries; configuration in
# .github/codeql/codeql-config.yml) of the SDK's JavaScript and TypeScript
# and of the GitHub Actions workflows. Results go to the repository's code
# scanning alerts (Security tab) and, on a pull request, to its checks and
# annotations. CodeQL is free for public repositories; this workflow is the
# "advanced setup", so CodeQL's "default setup" must stay off.
#
# Pull requests from forks run here too (pull_request: read-only token, no
# secrets). Nothing is built: CodeQL reads both languages without a build
# (build-mode: none).
name: CodeQL

on:
  push:
    branches: [main]
  # Every pull request, whatever it changes, so every merged commit has been
  # analysed (Scorecard SAST counts the merged pull requests with a run).
  pull_request:
  schedule:
    - cron: "47 3 * * 1" # Mondays 03:47 UTC: new queries on unchanged code
  workflow_dispatch:

permissions: {}

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  analyze:
    name: ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # upload the results to code scanning
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
