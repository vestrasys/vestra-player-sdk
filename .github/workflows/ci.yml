# Branches and pull requests. Pushes to main run main.yml (the same checks
# plus the Pages deploy) instead. Only `ci-ok` needs to be a required check.
#
#   static ─▶ build ─┬─▶ test, examples (ubuntu, windows, macos × node 26)
#                    └─▶ docs
#   ci-ok  (needs all; skipped counts as passed, failure/cancelled fails)
name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static:
    uses: ./.github/workflows/_static.yml
    permissions:
      contents: read
  build:
    needs: static
    uses: ./.github/workflows/_build.yml
    permissions:
      contents: read
  test:
    needs: build
    uses: ./.github/workflows/_test.yml
    permissions:
      contents: read
  docs:
    needs: build
    uses: ./.github/workflows/_docs.yml
    permissions:
      contents: read

  ci-ok:
    if: always()
    needs: [static, build, test, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: All required jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              failure|cancelled) echo "::error::a required job ended with: $result"; exit 1 ;;
            esac
          done
