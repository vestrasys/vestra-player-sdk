# API documentation (TypeDoc; warnings are errors: undocumented exports,
# broken links). With `pages: true` the site is uploaded as the GitHub Pages
# artifact for main.yml's deploy job. Called by ci.yml, main.yml, release.yml.
name: Docs

on:
  workflow_call:
    inputs:
      cache:
        description: Use the npm cache (off for releases).
        type: boolean
        default: true
      pages:
        description: Upload the site as the GitHub Pages artifact.
        type: boolean
        default: false

permissions: {}

jobs:
  docs:
    name: typedoc
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: ${{ inputs.cache && 'npm' || '' }}
      - run: npm ci --ignore-scripts
      - run: npm run docs
      - if: inputs.pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs-site
