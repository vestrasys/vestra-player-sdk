# Unit tests and the example plugins on Ubuntu, Windows and macOS × Node 26.
# Both use the `dist` artifact from _build.yml (the CLI resolves the package
# through dist/).
# Called by ci.yml, main.yml and release.yml.
name: Tests

on:
  workflow_call:
    inputs:
      cache:
        description: Use the npm cache (off for releases).
        type: boolean
        default: true

permissions: {}

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: "26" }
          - { os: windows-latest, node: "26" }
          - { os: macos-latest, node: "26" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: ${{ inputs.cache && 'npm' || '' }}
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - run: npm test

  # Every example plugin in examples/ against this SDK: npm install (links the
  # SDK), vestra-plugin check, test and pack (scripts/check-examples.mjs).
  examples:
    name: examples (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: "26" }
          - { os: windows-latest, node: "26" }
          - { os: macos-latest, node: "26" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: ${{ inputs.cache && 'npm' || '' }}
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - run: npm run examples
