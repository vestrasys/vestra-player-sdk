name: API proposal
description: Propose a new or changed plugin API (types, methods, capabilities, error codes). Needs agreement before a pull request.
labels: [api]
body:
  - type: markdown
    attributes:
      value: |
        The plugin API `vestra/1` is implemented by the player, so every change needs work on both sides. Describe the problem first; the shape of the API is decided in this issue.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What do you want your plugin to do, and why can it not do it today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API
      description: Types and signatures, the capability it needs, how it fails (error codes), and a short usage example.
      render: ts
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and workarounds
      description: What you tried with the current API.
